name: quick-check

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install quick-run dependency
        run: python -m pip install numpy
      - name: Compile Python sources
        run: python -m compileall -q rb_afl_system quick_run.py
      - name: Run CPU smoke demo
        run: |
          python quick_run.py
          python examples/quick_test.py
          python RUN_IN_PYCHARM.py
