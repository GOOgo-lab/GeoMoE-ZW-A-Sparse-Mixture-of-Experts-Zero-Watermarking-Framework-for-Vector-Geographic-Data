name: quick-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install quick-test dependency
        run: python -m pip install numpy

      - name: Compile Python sources
        run: python -m compileall -q rb_afl_system quick_run.py

      - name: Run GeoMoE-ZW quick test
        run: python quick_run.py
