[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomoe-zw"
version = "0.1.0"
description = "GeoMoE-ZW sparse mixture-of-experts zero-watermarking for vector geographic data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
full = [
  "torch>=2.0",
  "pandas>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "scipy>=1.10",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["rb_afl_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
